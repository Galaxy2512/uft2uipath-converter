name: tests

on:
  push:
    branches:
      - develop
      - feature/qcp-end-to-end-slice
      - feature/studio-validation
  pull_request:
    branches:
      - develop

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q
