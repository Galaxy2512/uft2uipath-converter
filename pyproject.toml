[project]
name = "uft2uipath-converter"
version = "0.2.0"
description = "ALM/UFT BPT QCP to UiPath Test Project converter"
requires-python = ">=3.10"
dependencies = ["olefile>=0.46"]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    # Reads the UiPath activity assemblies in tools/read_activity_metadata.py,
    # so modern activity properties are looked up instead of guessed.
    "dnfile>=0.15",
]

[project.scripts]
uft2uipath = "uft2uipath.cli:main"

[tool.setuptools.packages.find]
include = ["uft2uipath*"]
exclude = ["tests*", "samples*", "output*", "examples*"]
